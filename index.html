<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buyer nurture flows — weekly performance</title>
<style>
  :root{
    --ink:#171717; --ink-2:#404040; --mute:#737373; --faint:#a3a3a3;
    --line:#e5e5e5; --line-2:#d4d4d4; --panel:#f5f5f5; --white:#fff;
    --up:#16a34a; --down:#dc2626; --warn:#b45309; --brand:#2563eb;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--white);color:var(--ink);font-family:var(--sans);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto}

  /* ---- header ---- */
  .masthead{background:#171717;color:#fff;padding:26px 34px;display:flex;
            justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;
           text-transform:uppercase;color:#8a8a8a}
  .masthead h1{margin:8px 0 0;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .masthead h1 span{color:#8a8a8a;font-weight:400}
  .meta{font-family:var(--mono);font-size:10.5px;line-height:1.85;color:#8a8a8a;text-align:right}
  .meta b{color:#e5e5e5;font-weight:400}

  /* ---- tabs ---- */
  .tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;padding:0 34px}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
       padding:14px 4px;margin-right:30px;font:inherit;font-size:13.5px;color:var(--mute);
       cursor:pointer}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  .pane{padding:0 34px 56px}
  .pane[hidden]{display:none}

  /* ---- generic section furniture ---- */
  .band{background:var(--panel);margin:0 -34px;padding:26px 34px}
  .sect{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px}
  .sect h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .sect .when{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
               text-transform:uppercase;color:var(--faint)}
  .note{background:#fafafa;border:1px solid var(--line);border-left:2px solid var(--ink);
        padding:13px 16px;font-size:13px;color:var(--ink-2);margin:16px 0}
  .note b{font-weight:600;color:var(--ink)}

  /* ---- kpi cards ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kpi{background:#fff;border:1px solid var(--line);padding:13px 14px 12px}
  .kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
          text-transform:uppercase;color:var(--mute)}
  .kpi .v{font-family:var(--mono);font-size:23px;font-weight:500;letter-spacing:-.02em;
          margin:7px 0 5px;font-variant-numeric:tabular-nums}
  .kpi .d{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
  .kpi .d.up{color:var(--up)} .kpi .d.down{color:var(--down)} .kpi .d.flat{color:var(--faint)}
  .kpi .lw{border-top:1px dotted var(--line);margin-top:9px;padding-top:8px;
           display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .kpi .lw .lwk{font-family:var(--mono);font-size:9px;letter-spacing:.1em;
                text-transform:uppercase;color:var(--faint)}
  .kpi .lw .lwv{font-family:var(--mono);font-size:13px;font-weight:500;
                font-variant-numeric:tabular-nums}
  .kpi .d.neutral{color:var(--faint)}
  .barlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
          color:var(--ink);border-bottom:1px solid var(--line-2);padding-bottom:6px;margin:0 0 10px;
          display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .barlab span{color:var(--faint);letter-spacing:.08em}
  .bar2{margin-top:26px}
  .yoy td.dn{color:var(--down)} .yoy td.upp{color:var(--up)}
  .yoy td:first-child{font-family:var(--mono);font-size:11px;word-break:break-all}
  .flagrow{background:#fffbeb}
  .keyfind{background:#171717;color:#fff;padding:20px 22px;margin:18px 0}
  .keyfind .kf{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
               text-transform:uppercase;color:#8a8a8a;margin-bottom:8px}
  .keyfind p{margin:0 0 8px;font-size:14.5px;line-height:1.55;color:#e5e5e5}
  .keyfind p:last-child{margin-bottom:0}
  .keyfind b{color:#fff;font-weight:600}
  .acts{border-top:1px solid var(--line-2)}
  .act{display:grid;grid-template-columns:30px 1fr;gap:14px;padding:13px 0;
       border-bottom:1px solid var(--line)}
  .actn{font-family:var(--mono);font-size:16px;color:var(--faint);line-height:1.3}
  .acth{font-size:14px;font-weight:600;margin-bottom:3px;display:flex;gap:10px;
        align-items:baseline;flex-wrap:wrap}
  .acth span{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
             text-transform:uppercase;color:var(--mute);font-weight:400}
  .act p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}
  .sig{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.07em;
       text-transform:uppercase;padding:2px 6px;border:1px solid}
  .sig.yes{color:#166534;border-color:#bbf7d0;background:#f0fdf4}
  .sig.no{color:var(--mute);border-color:var(--line);background:#fafafa}
  .vsrest{font-family:var(--mono);font-size:9px;color:var(--faint);margin-left:6px;
          letter-spacing:.06em;text-transform:uppercase}
  /* collapsible sections */
  details.sec{border-top:1px solid var(--line-2);margin-top:0}
  details.sec>summary{list-style:none;cursor:pointer;padding:15px 0 14px;
    display:flex;align-items:baseline;gap:12px;user-select:none}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::before{content:'+';font-family:var(--mono);font-size:15px;
    color:var(--faint);width:14px;flex:none;line-height:1.2}
  details.sec[open]>summary::before{content:'\2013'}
  details.sec>summary h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
  details.sec>summary .when{font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--faint)}
  details.sec>summary:hover h2{color:var(--brand)}
  details.sec>.body{padding:0 0 22px 26px}
  @media (max-width:840px){ details.sec>.body{padding-left:0} }
  /* chart hover tooltip */
  #tip{position:fixed;z-index:99;pointer-events:none;opacity:0;transition:opacity .1s;
    background:#171717;color:#fff;font-family:var(--mono);font-size:11px;
    padding:6px 9px;border-radius:2px;white-space:nowrap;line-height:1.45}
  #tip b{color:#fff;font-weight:600}
  [data-tip]{cursor:crosshair}
  /* metric toggle */
  .mtoggle{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
  .mtoggle button{appearance:none;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;padding:5px 9px;border:1px solid var(--line-2);background:#fff;
    color:var(--mute);cursor:pointer}
  .mtoggle button[aria-pressed="true"]{background:#171717;color:#fff;border-color:#171717}
  .na{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.04em}
  .prov td{font-size:11.5px;vertical-align:top;line-height:1.5}
  .prov td:first-child{font-family:var(--sans);font-weight:500;font-size:12.5px}
  .gaps{border-top:1px solid var(--line-2)}
  .gap{padding:13px 0;border-bottom:1px solid var(--line)}
  .gaphead{font-size:13.5px;font-weight:600;margin-bottom:4px;display:flex;
           justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
  .gaphead span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                text-transform:uppercase;color:var(--warn);font-weight:400;
                border:1px solid #fde68a;background:#fffbeb;padding:2px 6px}
  .gap p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}
  .scope{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
         color:var(--mute);border-bottom:1px solid var(--line-2);padding-bottom:6px;
         margin:0 0 10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .scope b{color:var(--ink);font-weight:500}

  /* ---- benchmark table ---- */
  table{width:100%;border-collapse:collapse}
  .bm th,.bm td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);
                font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
  .bm th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);
         border-bottom:1px solid var(--line-2)}
  .bm th:first-child,.bm td:first-child{text-align:left;font-family:var(--sans);font-size:13px}
  .verdict{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .verdict.ahead{color:var(--up)} .verdict.behind{color:var(--down)}
  .verdict.level{color:var(--faint)}

  /* ---- trend chart ---- */
  .chart{background:#fff;border:1px solid var(--line);padding:18px 18px 10px}
  .chart h3{margin:0 0 2px;font-size:13.5px;font-weight:600}
  .chart .sub{font-family:var(--mono);font-size:10px;color:var(--faint);
              letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
  .legend{display:flex;gap:16px;margin-top:8px;font-family:var(--mono);font-size:10px;
          color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
  .legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}

  /* ---- the flow ladder (signature) ---- */
  .ladder{border-top:1px solid var(--line-2)}
  .rung{display:grid;grid-template-columns:44px 118px 1fr 300px;gap:18px;
        padding:18px 0;border-bottom:1px solid var(--line);align-items:start}
  .step{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:2px;
        letter-spacing:.04em}
  .step b{display:block;font-size:22px;color:var(--ink);font-weight:500;line-height:1}
  .shot{border:1px solid var(--line);background:var(--panel);aspect-ratio:5/4;
        overflow:hidden;display:flex;align-items:center;justify-content:center}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:top}
  .shot .pend{font-family:var(--mono);font-size:9px;color:var(--faint);text-align:center;
              padding:10px;letter-spacing:.08em;text-transform:uppercase;line-height:1.7}
  .subj{font-size:14.5px;font-weight:500;margin:0 0 4px;letter-spacing:-.01em}
  .subj.none{color:var(--faint);font-weight:400;font-style:italic}
  .slug{font-family:var(--mono);font-size:10.5px;color:var(--mute);word-break:break-all}
  .links{margin-top:9px;display:flex;gap:14px;flex-wrap:wrap}
  .links a{font-family:var(--mono);font-size:10.5px;color:var(--brand);text-decoration:none;
           border-bottom:1px solid #c7d8fb;padding-bottom:1px}
  .links a:hover{border-bottom-color:var(--brand)}
  .chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
        text-transform:uppercase;padding:3px 7px;margin-top:10px;border:1px solid}
  .chip.win{color:#166534;border-color:#bbf7d0;background:#f0fdf4}
  .chip.watch{color:#92400e;border-color:#fde68a;background:#fffbeb}
  .chip.stall{color:#991b1b;border-color:#fecaca;background:#fef2f2}
  .chip.ok{color:var(--mute);border-color:var(--line);background:#fafafa}

  .mrow{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
  .m{display:flex;justify-content:space-between;align-items:baseline;
     border-bottom:1px dotted var(--line);padding:3px 0}
  .m span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
          text-transform:uppercase;color:var(--mute)}
  .m b{font-family:var(--mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
  .m b.hi{color:var(--up)} .m b.lo{color:var(--down)}

  /* ---- wins ---- */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .col{background:#fff;border:1px solid var(--line);padding:16px 18px}
  .col h3{margin:0 0 12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
          text-transform:uppercase;color:var(--mute)}
  .col.w{border-top:2px solid var(--up)} .col.a{border-top:2px solid var(--down)}
  .col ul{margin:0;padding:0;list-style:none}
  .col li{padding:9px 0;border-bottom:1px dotted var(--line);font-size:13.5px;color:var(--ink-2)}
  .col li:last-child{border-bottom:0}
  .col li b{color:var(--ink);font-weight:600}
  .col li em{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--ink)}

  footer{border-top:1px solid var(--line);margin:0 -34px;padding:22px 34px 0;
         font-size:12.5px;color:var(--mute)}
  footer h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--ink);margin:0 0 8px}
  footer li{margin-bottom:6px}

  @media (max-width:840px){
    .rung{grid-template-columns:34px 1fr;gap:12px}
    .shot{grid-column:2;max-width:170px}
    .cols{grid-template-columns:1fr}
    .masthead{padding:22px}.tabs{padding:0 22px}.pane{padding:0 22px 44px}
    .band,footer{margin:0 -22px;padding-left:22px;padding-right:22px}
  }
  @media (prefers-reduced-motion:no-preference){
    .pane:not([hidden]){animation:fade .22s ease}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  }
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">

  <div class="masthead">
    <div>
      <div class="eyebrow">Buyer CRM &middot; always-on</div>
      <h1>Nurture flows<br><span>weekly performance</span></h1>
    </div>
    <div class="meta">
      Wedding &middot; journey <b>950956</b><br>
      Moving Home &middot; journey <b>951750</b><br>
      Email + Push &middot; Tableau<br>
      PPR shown per 1k sends<br>
      Label <b>campaign_group: buyer_nurture</b><br>
      Week ending <b>Tue 1 Sep 2026</b><br>
      Generated <b>Wed 9 Sep 2026</b>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-wed" aria-controls="p-wed" aria-selected="true">Wedding</button>
    <button class="tab" role="tab" id="t-mov" aria-controls="p-mov" aria-selected="false">Moving Home</button>
  </div>

  <div class="pane" id="p-wed" role="tabpanel" aria-labelledby="t-wed"></div>
  <div class="pane" id="p-mov" role="tabpanel" aria-labelledby="t-mov" hidden></div>

</div>

<script>
/* ============================================================
   DATA — refresh this block each Monday.
   Engagement + conversion: Tableau "Email - Country-Date-Domain-Campaign"
   filtered to Email Campaign Group = buyer_nurture.
   Benchmarks: same datasource, filtered to the comparable Email Campaign
   SubGroup for each flow (not the whole marketing channel).
   Creative + subject lines: Iterable templates.
   ============================================================ */

/* Category benchmarks, Aug 2026 month to date (to 16 Aug).
   Wedding is benchmarked against the weddings subgroup; Moving Home against
   the cleaning, house_cleaning, odd_jobs and home_and_garden subgroups,
   which are the categories its comms actually promote. */
const BENCH = {
  wed:{ label:'Weddings category &middot; all buyer email &middot; Aug 2026 MTD',
        basis:'160,605 sends across 9 campaigns, full month of Aug', benchSends:160605,
        open:6322/160605, ctr:313/160605, unsub:227/160605, bounce:360/160605, proj1k:93/160.605 },
  mov:{ label:'Cleaning, home &amp; odd jobs categories &middot; Aug 2026 MTD',
        basis:'34715455 sends across 74 campaigns, full month of Aug', benchSends:34715455,
        open:1147918/34715455, ctr:36400/34715455, unsub:22807/34715455,
        bounce:96063/34715455, proj1k:5732/34715.455 }
};

/* Monthly filtered open rate %, Jan 2025 to Aug 2026, for the comparison
   categories. Used to separate seasonality from a real change in performance. */
const SEASON = {
  months:['Jan 25','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec',
          'Jan 26','Feb','Mar','Apr','May','Jun','Jul','Aug'],
  wed:[6.78,6.70,6.80,6.80,6.82,6.79,6.77,6.44,6.93,6.95,6.88,6.76,
       7.39,7.06,4.86,4.66,4.73,4.64,4.58,4.32],
  mov:[9.70,13.32,10.58,11.22,10.26,9.09,9.94,10.03,9.92,10.04,10.38,9.64,
       10.01,10.02,7.85,7.17,4.57,4.08,4.22,3.68]
};

/* Like-for-like YoY on the legacy wedding campaigns, 21 Jul to 17 Aug both years.
   [name, sends25, opens25, clicks25, unsub25, proj25, sends26, opens26, clicks26, unsub26, proj26] */
const YOY_WED = [
  ['buyer_targeted_wedding_ushv_241120_0',            48357,3472, 86,26,49, 35915,1823,58,19,17],
  ['buyer_targeted_wedding_hvbuyers_240815_0',        38941,3752, 56,32,24, 28938,2001,54,21,10],
  ['buyer_bob_targeted_weddings_241204_0',            22590,1933, 43,56,20, 32851,2102,49,94,13],
  ['buyer_events_based_weddings_250320_0',             5543, 789,150,33,57,  4735, 531,82,22,26],
  ['buyer_usbob_targeted_weddings_240918_MO',         14364, 128,  4, 3, 1, 20618, 150, 7, 9, 1],
  ['buyer_usbob_targeted_weddings_USpricing_250211_1',13103, 132, 10, 4, 8, 18943, 157,17, 3, 7],
  ['buyer_bob_targeted_weddings_UK_pricing_250129',   10143, 133, 11, 3, 3, 13295, 220,14, 4, 8],
  ['buyer_usbob_targeted_weddings_CApricing_250211_1', 1231,  19,  0, 0, 0,  1919,  27, 1, 0, 1]
];

/* Bark (project) volume in the categories each journey targets.
   Category sets derived from the journey entry lists and the in-email CTAs:
     Wedding      - Iterable list 9875473 buyer_nurture_weddings_2605
     Moving Home  - Iterable list 9936403 moving_home_nurture_entry_2605
   Iterable's API exposes only list metadata, not dynamic segment criteria, so
   the sets below come from the Handlebars entry conditions and the category
   links inside each template, then validated against Tableau category names. */
const DEMAND = {
  wed:{
    listId:9875473, listName:'buyer_nurture_weddings_2605', markets:'UK + US',
    cats:['Wedding Photography','Wedding Car Hire','Wedding Venues','Wedding Makeup',
          'Wedding DJ','Wedding Celebrants','Wedding Planning','Wedding Flowers',
          'Wedding Catering','Wedding Videography','Wedding Cakes','Wedding Music Bands'],
    excluded:'Generic Catering, DJ and Limousine Hire are left out: they are 280k barks a year but mostly non-wedding demand, and including them would drown the signal.',
    y25:[21432,13884,14204,12419,12904,13595,13430,14590,13286,11575,9491,6113],
    y26:[24749,15719,15551,11409,11689,12326,12961,6310]
  },
  mov:{
    listId:9936403, listName:'moving_home_nurture_entry_2605', markets:'UK',
    cats:['Removal Companies','Man & Van Services','End of Tenancy Cleaning',
          'Carpet Cleaning','House Clearance','Deep Cleaning Services','Waste Management'],
    excluded:'There is no Packing Services or Rubbish Removal category in Tableau; Waste Management is the rubbish equivalent. Broad House Cleaning is excluded as it is 189k barks and not move-specific.',
    y25:[14305,13178,14173,12587,15251,15132,16361,16587,16817,16363,15687,14449],
    y26:[19129,17362,18283,15724,16359,16609,16670,8140]
  }
};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const AUG_FRAC=16/31; /* Aug 2026 data runs to the 16th only */

/* Push, SMS and WhatsApp for both journeys.
   Tableau: CRM - Push-SMS-Whatsapp Reporting (6a536c4f), Campaign Group = buyer_nurture,
   Attribution Mode = any_7d_post_send, 27 May to 1 Sep 2026.
   The Attribution Mode filter is essential: rows repeat per mode and omitting it
   triples every send count.
   projPer1k uses buyer_project_count_any_7d_post_send, a LOOSER attribution than the
   email datasource uses. The two must not be summed or compared. See gaps below. */
const PUSH = {
  wed:{ sends:1036, opens:19, clicks:0, bounces:0, projPer1k:82.046, valuePer1k:500.01,
        emailSends:30136,
        camps:[
          ['buyer_nurture_wedding_push2_2605_2',17784612,509,5,'UK 260, US 249'],
          ['buyer_nurture_wedding_photographer_push_2605_2',17784402,300,7,'UK 171, US 129'],
          ['buyer_nurture_wedding_dj_push_2605_2',17784401,194,6,'UK 87, US 107'],
          ['buyer_nurture_wedding_catering_push_2605_2',17784404,33,1,'UK 9, US 24']
        ],
        other:[] },
  mov:{ sends:1132, opens:17, clicks:0, bounces:0, projPer1k:47.703, valuePer1k:214.74,
        emailSends:20181,
        camps:[

/* ---------- helpers ---------- */
const pct=(x,d=2)=>(x*100).toFixed(d)+'%';
const num=x=>x.toLocaleString('en-GB');
const gbp=x=>'\u00a3'+x.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const W=r=>({wc:r[0],s:r[1],o:r[2],c:r[3],u:r[4],b:r[5],p:r[6],r:r[7]||0});
const per1k=(n,s)=>s?n/(s/1000):0;
const gbp1k=(r,s)=>'\u00a3'+per1k(r,s).toFixed(2);
/* Collapsible section. open=true for the two the reader should always see. */
const sec=(title,when,body,open)=>`<details class="sec"${open?' open':''}>
    <summary><h2>${title}</h2><span class="when">${when}</span></summary>
    <div class="body">${body}</div></details>`;

/* Direction of good varies by metric:
   'up'      higher is better (open, ctr, ctor, projects, ppr)
   'down'    lower is better  (unsub, bounce)
   'neutral' no good or bad   (sends)                                        */
function delta(cur,prev,{pp=false,dir='up',dp=2}={}){
  if(prev==null) return {cls:'neutral',txt:'\u2014'};
  if(prev===0 && cur===0) return {cls:'neutral',txt:'0 both weeks'};
  if(prev===0) return {cls:dir==='neutral'?'neutral':(dir==='up'?'up':'down'),
                       txt:'up from 0'};
  const d = pp ? (cur-prev)*100 : (cur-prev)/prev*100;
  if(Math.abs(d)<0.0005) return {cls:'neutral',txt:'no change'};
  const arrow = d>0 ? '\u2191' : '\u2193';
  const mag = `${arrow} ${Math.abs(d).toFixed(dp)}${pp?'pp':'%'}`;
  if(dir==='neutral') return {cls:'neutral',txt:mag};
  const better = dir==='up' ? d>0 : d<0;
  return {cls:better?'up':'down', txt:mag};
}

    <div class="v">${v}</div><div class="d neutral">${foot}</div></div>`;

/* ---------- significance: two-proportion z-test ---------- */
function normcdf(x){
  const t=1/(1+0.2316419*x), d=0.3989423*Math.exp(-x*x/2);
  const poly=t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return 1-d*poly;
}
function ztest(x1,n1,x2,n2){
  if(!n1||!n2) return {sig:false,txt:'no data',p:1};
  const p1=x1/n1, p2=x2/n2, pp=(x1+x2)/(n1+n2);
  const se=Math.sqrt(pp*(1-pp)*(1/n1+1/n2));
  if(!se) return {sig:false,txt:'no variance',p:1};
  const z=(p1-p2)/se, pv=2*(1-normcdf(Math.abs(z)));
  return {z,p:pv,sig:pv<0.05,
          txt: pv<0.001?'p&lt;0.001':'p='+pv.toFixed(3)};
}
const sigChip=r=>`<span class="sig ${r.sig?'yes':'no'}">${r.sig?'sig':'not sig'} &middot; ${r.txt}</span>`;

/* ---------- trend chart ---------- */
function chart(weeks){
  const w=980,h=210,pl=44,pr=44,pt=14,pb=26;
  const iw=w-pl-pr, ih=h-pt-pb, n=weeks.length, bw=iw/n;
  const rows=weeks.map(W);
  const maxS=Math.max(...rows.map(r=>r.s))*1.1;
  const maxR=Math.max(...rows.flatMap(r=>[r.o/r.s, r.c/r.s*20]))*1.15;
  const x=i=>pl+bw*i+bw/2, yS=v=>pt+ih-(v/maxS)*ih, yR=v=>pt+ih-(v/maxR)*ih;
  const tip=r=>`w/c ${r.wc}|Sends <b>${num(r.s)}</b>|Open <b>${pct(r.o/r.s,2)}</b>`+
    `|CTR <b>${pct(r.c/r.s,3)}</b>|Unsub <b>${pct(r.u/r.s,3)}</b>`;
  const bars=rows.map((r,i)=>`<rect x="${pl+bw*i+bw*0.24}" y="${yS(r.s)}" width="${bw*0.52}"
       height="${pt+ih-yS(r.s)}" fill="#e8ecf3" data-tip="${tip(r)}"/>`).join('');
  const line=(vals,col)=>`<polyline points="${vals.map((v,i)=>`${x(i)},${yR(v)}`).join(' ')}"
       fill="none" stroke="${col}" stroke-width="1.8"/>`+
    vals.map((v,i)=>`<circle cx="${x(i)}" cy="${yR(v)}" r="4.5" fill="transparent"
       data-tip="${tip(rows[i])}"/><circle cx="${x(i)}" cy="${yR(v)}" r="2.6" fill="#fff"
       stroke="${col}" stroke-width="1.6" pointer-events="none"/>`).join('');
  const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="9.5"
       font-family="monospace" fill="${i===n-1?'#171717':'#a3a3a3'}">${r.wc}</text>`).join('');
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${w-pr}" y1="${pt+ih*f}" y2="${pt+ih*f}"
       stroke="#f0f0f0"/>`).join('');
  return `<div class="chart">
    <h3>Weekly send volume, open rate and CTR</h3>
    <div class="sub">Hover any point for the underlying numbers</div>
    <svg viewBox="0 0 ${w} ${h}" width="100%" role="img"
         aria-label="Weekly sends, open rate and CTR since launch">
      ${grid}${bars}${line(rows.map(r=>r.o/r.s),'#171717')}${line(rows.map(r=>r.c/r.s*20),'#2563eb')}${labels}
    </svg>
    <div class="legend">
      <span><i style="background:#e8ecf3"></i>Sends</span>
      <span><i style="background:#171717"></i>Open rate</span>
      <span><i style="background:#2563eb"></i>CTR (&times;20 scale)</span>
    </div></div>`;
}

const METRICS=[
  ['sends','Send volume',   d=>d.s,            v=>num(Math.round(v))],
  ['open', 'Open rate',     d=>d.o/d.s,        v=>pct(v,2)],
  ['ctr',  'Click rate',    d=>d.c/d.s,        v=>pct(v,3)],
  ['unsub','Unsubs',        d=>d.u/d.s,        v=>pct(v,3)],
  ['bounce','Bounces',      d=>d.b/d.s,        v=>pct(v,3)],
  ['proj', 'Projects / 1k', d=>per1k(d.p,d.s), v=>v.toFixed(3)],

/* 13 Wed-Tue weeks = one 3-month increment. Trailing partial blocks are labelled. */
function increments(weeks){
  const rows=weeks.map(W), out=[];
  for(let i=0;i<rows.length;i+=13){
    const blk=rows.slice(i,i+13);
    const a=blk.reduce((x,y)=>({s:x.s+y.s,o:x.o+y.o,c:x.c+y.c,u:x.u+y.u,
                                b:x.b+y.b,p:x.p+y.p,r:x.r+y.r}),
                       {s:0,o:0,c:0,u:0,b:0,p:0,r:0});
    a.label=`Months ${Math.floor(i/13)*3+1}\u2013${Math.floor(i/13)*3+3}`;
    a.range=`${blk[0].wc} to ${blk[blk.length-1].wc}`;
    a.weeks=blk.length; a.partial=blk.length<13;
    out.push(a);
  }
  return out;
}

function incrementChart(key){
  const blocks=increments(FLOWS[key].weeks);
  const id='inc-'+key;
  const series=METRICS.map(([k,lab,get,f])=>({k,lab,
    vals:blocks.map(b=>get(b)), fmt:blocks.map(b=>f(get(b)))}));
  const w=980,h=240,pl=64,pr=24,pt=18,pb=42, iw=w-pl-pr, ih=h-pt-pb;
  const n=blocks.length, bw=iw/Math.max(n,4);
  const svg=series.map((sr,si)=>{
    const max=Math.max(...sr.vals)*1.2||1;
    const y=v=>pt+ih-(v/max)*ih;
    const bars=blocks.map((b,i)=>`<g data-tip="${b.label} (${b.range})|${b.weeks} weeks${b.partial?' \u2014 incomplete':''}|${sr.lab} <b>${sr.fmt[i]}</b>|Sends <b>${num(b.s)}</b>">
        <rect x="${pl+bw*i+bw*0.2}" y="${y(sr.vals[i])}" width="${bw*0.6}"
          height="${Math.max(pt+ih-y(sr.vals[i]),1)}"
          fill="${b.partial?'#c7d8fb':'#2563eb'}"/>
        <text x="${pl+bw*i+bw*0.5}" y="${y(sr.vals[i])-7}" text-anchor="middle"
          font-size="11" font-family="monospace" fill="#171717">${sr.fmt[i]}</text></g>`).join('');
    const lab=blocks.map((b,i)=>`<text x="${pl+bw*i+bw*0.5}" y="${h-24}" text-anchor="middle"
        font-size="10" font-family="monospace" fill="#737373">${b.label}</text>
      <text x="${pl+bw*i+bw*0.5}" y="${h-11}" text-anchor="middle"
        font-size="8.5" font-family="monospace" fill="#a3a3a3">${b.range}${b.partial?' *':''}</text>`).join('');
    return `<svg data-series="${sr.k}" viewBox="0 0 ${w} ${h}" width="100%" role="img"
        aria-label="${sr.lab} by three-month increment since launch"
        style="display:${si===0?'block':'none'}">
        <line x1="${pl}" x2="${w-pr}" y1="${pt+ih}" y2="${pt+ih}" stroke="#d4d4d4"/>
        ${bars}${lab}</svg>`;
  }).join('');
  return `<div class="chart" id="${id}">
    <h3>Performance since launch, in 3-month increments</h3>
    <div class="sub">Switch metric &middot; pale bars are incomplete periods</div>
    <div class="mtoggle">${METRICS.map(([k,lab],i)=>
      `<button data-m="${k}" aria-pressed="${i===0}">${lab}</button>`).join('')}</div>
    ${svg}
    <div class="note" style="margin-bottom:0">Only
      ${blocks.filter(b=>!b.partial).length} complete 3-month period${blocks.filter(b=>!b.partial).length===1?'':'s'}
      so far, so this chart is thin until the flow has been live longer. It fills out
      from December.</div>
  </div>`;
}

/* ---------- seasonality chart: same months, both years ---------- */
function seasonChart(key){
  const months=SEASON.months, series=SEASON[key];
  const w=980,h=200,pl=44,pr=20,pt=14,pb=28;
  const iw=w-pl-pr, ih=h-pt-pb, n=months.length;
  const max=Math.max(...series)*1.12;
  const x=i=>pl+(iw/(n-1))*i, y=v=>pt+ih-(v/max)*ih;
  const pts=series.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const dots=series.map((v,i)=>{
    const aug = months[i]==='Aug';
    return `<circle cx="${x(i)}" cy="${y(v)}" r="${aug?3.8:2.4}"
      fill="${aug?'#dc2626':'#fff'}" stroke="${aug?'#dc2626':'#171717'}" stroke-width="1.5"/>`;
  }).join('');
  const augLab=months.map((m,i)=> m==='Aug'
    ? `<text x="${x(i)}" y="${y(series[i])-10}" text-anchor="middle" font-size="10"
         font-family="monospace" fill="#dc2626">${series[i].toFixed(1)}%</text>` : '').join('');
  const labels=months.map((m,i)=> (i%2===0||m==='Aug')
    ? `<text x="${x(i)}" y="${h-9}" text-anchor="middle" font-size="9"
         font-family="monospace" fill="#a3a3a3">${m}</text>` : '').join('');
  /* March 2026 marker, index 14 */
  const brk=`<line x1="${x(12)}" x2="${x(12)}" y1="${pt}" y2="${pt+ih}"
      stroke="#d4d4d4" stroke-dasharray="3 3"/>
    <text x="${x(12)+5}" y="${pt+11}" font-size="9" font-family="monospace"
      fill="#737373">Mar 2026 step change</text>`;
  return `<div class="chart">
    <h3>Category open rate by month, both years</h3>
    <div class="sub">Augusts marked in red &middot; Jan 2025 to Aug 2026</div>
    <svg viewBox="0 0 ${w} ${h}" width="100%" role="img"
         aria-label="Monthly category open rate across 2025 and 2026">
      ${brk}<polyline points="${pts}" fill="none" stroke="#171717" stroke-width="1.8"/>
      ${dots}${augLab}${labels}
    </svg></div>`;
}

/* ---------- YoY table for the legacy wedding campaigns ---------- */
function yoyTable(){
  const rows=YOY_WED.map(r=>{
    const [nm,s5,o5,c5,u5,p5,s6,o6,c6,u6,p6]=r;
    const or5=o5/s5, or6=o6/s6, ct5=c5/s5, ct6=c6/s6;
    const pk5=p5/(s5/1000), pk6=p6/(s6/1000);
    const orD=(or6-or5)*100, pkD=pk5? (pk6-pk5)/pk5*100 : 0;
    const broken = or5<0.02;
    return `<tr class="${broken?'flagrow':''}">
      <td>${nm}${broken?' &#9888;':''}</td>
      <td>${pct(or5,2)}</td><td>${pct(or6,2)}</td>
      <td class="${orD<0?'dn':'upp'}">${orD>0?'+':''}${orD.toFixed(2)}pp</td>
      <td>${pct(ct5,3)}</td><td>${pct(ct6,3)}</td>
      <td>${pk5.toFixed(2)}</td><td>${pk6.toFixed(2)}</td>
      <td class="${pkD<0?'dn':'upp'}">${pkD>0?'+':''}${pkD.toFixed(0)}%</td></tr>`;
  }).join('');
  return `<table class="bm yoy"><thead><tr>
      <th>Campaign</th><th>Open 25</th><th>Open 26</th><th>Change</th>
      <th>CTR 25</th><th>CTR 26</th><th>Proj/1k 25</th><th>Proj/1k 26</th><th>Change</th>
    </tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Same four-week window both years, 21 July to 17 August.
      <b>Every campaign lost open rate, by 0.13pp to 3.02pp.</b> The four rows flagged
      &#9888; sit under a 2% open rate in both years, which is far too low to be real
      engagement and points at missing tracking on those sends rather than a bad audience.
      They are 34% of wedding volume this August against 25% last, so they drag the
      category average down independently of anything else.</div>`;
}

/* ---------- benchmark table: overall and last week against category ---------- */
function bmTable(key,all,cur){
  const b=BENCH[key];
  const N=b.benchSends, rows=[
    ['Open rate (filtered)', all.o/all.s, cur.o/cur.s, b.open, 1, 'up',  ztest(all.o,all.s,Math.round(b.open*N),N)],
    ['Click-through rate',   all.c/all.s, cur.c/cur.s, b.ctr,  3, 'up',  ztest(all.c,all.s,Math.round(b.ctr*N),N)],
    ['Unsubscribe rate',     all.u/all.s, cur.u/cur.s, b.unsub,3, 'down',ztest(all.u,all.s,Math.round(b.unsub*N),N)],
    ['Bounce rate',          all.b/all.s, cur.b/cur.s, b.bounce,3,'down',ztest(all.b,all.s,Math.round(b.bounce*N),N)],
    ['Projects per 1k sends',all.p/(all.s/1000)/100, cur.p/(cur.s/1000)/100, b.proj1k/100, 2,'up',
      ztest(all.p,all.s,Math.round(b.proj1k/1000*N),N)]
  ];
  return `<table class="bm"><thead><tr>
      <th>Metric</th><th>Since launch</th><th>Last week</th>
      <th>Category</th><th>Index</th><th>Read</th><th>Significance</th>
    </tr></thead><tbody>`+rows.map(([k,v,lw,bv,dp,dir,sg])=>{
      const idx=bv?v/bv:0;
      const good = dir==='up' ? v>bv : v<bv;
      const cls = Math.abs(idx-1)<0.08 ? 'level' : (good?'ahead':'behind');
      const read = Math.abs(idx-1)<0.08 ? 'In line' : (good?'Ahead':'Behind');
      const f = k.startsWith('Projects')
        ? (x=>(x*100).toFixed(dp)) : (x=>pct(x,dp));
      return `<tr><td>${k}</td><td>${f(v)}</td><td>${f(lw)}</td><td>${f(bv)}</td>
        <td>${idx.toFixed(2)}&times;</td><td class="verdict ${cls}">${read}</td>
        <td>${sigChip(sg)}</td></tr>`;
    }).join('')+`</tbody></table>
    <div class="note"><b>Benchmark:</b> ${b.label} (${b.basis}). This replaces the
    whole-channel average, which mixed transactional and high-intent sends and made
    both flows look worse than they are.</div>`;
}

/* ---------- comm ladder ---------- */
/* Flags compare each comm against the rest of its own flow and only fire when the
   difference is significant, so a small comm cannot be labelled on noise alone. */
function flag(c,key,rest){
  const b=BENCH[key];
  const uT=ztest(c.u,c.s,rest.u,rest.s), cT=ztest(c.c,c.s,rest.c,rest.s);
  const ctr=c.c/c.s, unsub=c.u/c.s;
  if(uT.sig && unsub>rest.u/rest.s) return ['stall','Unsub outlier',uT];
  if(cT.sig && ctr<rest.c/rest.s)   return ['watch','Weak CTR',cT];
  if(cT.sig && ctr>rest.c/rest.s)   return ['win','Best for clicks',cT];
  if(c.c===0 && c.s>500)            return ['watch','No clicks yet',cT];
  return ['ok','No sig difference',cT];
}

function ladder(comms,key){
  const b=BENCH[key];
  const tot=comms.reduce((a,x)=>({s:a.s+x.s,o:a.o+x.o,c:a.c+x.c,u:a.u+x.u}),{s:0,o:0,c:0,u:0});
  return `<div class="ladder">`+comms.map(c=>{
    const rest={s:tot.s-c.s,o:tot.o-c.o,c:tot.c-c.c,u:tot.u-c.u};
    const open=c.o/c.s, ctr=c.c/c.s, ctor=c.o?c.c/c.o:0, unsub=c.u/c.s;
    const [cls,txt,tst]=flag(c,key,rest);
    const shot = c.hero
      ? `<img src="${c.hero}" alt="Creative for ${c.slug}" loading="lazy">`
      : `<div class="pend">Preview<br>in Iterable</div>`;
    const cmp=(v,bv,inv=false)=> (inv ? v<bv : v>bv) ? 'hi' : 'lo';
    return `<div class="rung">
      <div class="step">Email<b>${c.n}</b></div>
      <div class="shot">${shot}</div>
      <div>
        ${c.subject ? `<p class="subj">${c.subject}</p>`
                    : `<p class="subj none">Subject line not yet pulled</p>`}
        <div class="slug">${c.slug}</div>
        <div class="links">
          <a href="https://app.iterable.com/campaigns/${c.id}" target="_blank" rel="noopener">Campaign ${c.id}</a>
          <a href="https://app.iterable.com/templates/editor?templateId=${c.tpl}&mode=email" target="_blank" rel="noopener">Open creative</a>
        </div>
        <span class="chip ${cls}">${txt}</span>
        <div style="margin-top:7px">${sigChip(tst)}<span class="vsrest">vs rest of flow</span></div>
      </div>
      <div class="mrow">
        <div class="m"><span>Sends</span><b>${num(c.s)}</b></div>
        <div class="m"><span>Open rate</span><b class="${cmp(open,b.open)}">${pct(open,1)}</b></div>
        <div class="m"><span>CTR</span><b class="${cmp(ctr,b.ctr)}">${pct(ctr,3)}</b></div>
        <div class="m"><span>CTOR</span><b>${pct(ctor,1)}</b></div>
        <div class="m"><span>Unsub</span><b class="${cmp(unsub,b.unsub,true)}">${pct(unsub,3)}</b></div>
        <div class="m"><span>Projects</span><b>${c.p}</b></div>
      </div></div>`;
  }).join('')+`</div>`;
}

function splitTable(split){
  if(split.length<2) return '';
  const tot=split.reduce((a,r)=>a+r[1],0);
  return `<p class="barlab" style="margin-top:22px"><span>Market split &middot; last 4 weeks</span></p>
    <table class="bm"><thead><tr><th>Market</th><th>Sends</th><th>Open rate</th>
      <th>CTR</th><th>Share of sends</th></tr></thead><tbody>`+
    split.map(([m,s,o,c])=>`<tr><td>${m}</td><td>${num(s)}</td><td>${pct(o/s,1)}</td>
      <td>${pct(c/s,3)}</td><td>${pct(s/tot,0)}</td></tr>`).join('')+`</tbody></table>`;
}


/* ---------- category demand: barks per month, this year against last ---------- */
function demandChart(key){
  const d=DEMAND[key], w=980,h=230,pl=52,pr=20,pt=16,pb=30;
  const iw=w-pl-pr, ih=h-pt-pb, n=12;
  const max=Math.max(...d.y25,...d.y26)*1.12;
  const x=i=>pl+(iw/(n-1))*i, y=v=>pt+ih-(v/max)*ih;
  const lastFull=d.y26.length-2;            /* Jul index */
  const augIdx=d.y26.length-1;
  const augProj=Math.round(d.y26[augIdx]/AUG_FRAC);

  const p25=d.y25.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const p26=d.y26.slice(0,lastFull+1).map((v,i)=>`${x(i)},${y(v)}`).join(' ');

  const dots=(arr,col,upTo)=>arr.slice(0,upTo+1).map((v,i)=>
    `<circle cx="${x(i)}" cy="${y(v)}" r="2.4" fill="#fff" stroke="${col}" stroke-width="1.5"/>`).join('');

  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${w-pr}" y1="${pt+ih*f}"
      y2="${pt+ih*f}" stroke="#f2f2f2"/>`).join('');
  const yax=[0,.5,1].map(f=>`<text x="${pl-8}" y="${pt+ih*(1-f)+3}" text-anchor="end"
      font-size="9" font-family="monospace" fill="#a3a3a3">${Math.round(max*f/1000)}k</text>`).join('');
  const labels=MON.map((m,i)=>`<text x="${x(i)}" y="${h-10}" text-anchor="middle" font-size="9"
      font-family="monospace" fill="${i===augIdx?'#171717':'#a3a3a3'}">${m}</text>`).join('');

  /* partial August: dashed run-out plus the pro-rata projection */
  const partial=`
    <line x1="${x(lastFull)}" y1="${y(d.y26[lastFull])}" x2="${x(augIdx)}" y2="${y(d.y26[augIdx])}"
      stroke="#171717" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="${x(augIdx)}" cy="${y(d.y26[augIdx])}" r="3" fill="#fff"
      stroke="#171717" stroke-width="1.5"/>
    <circle cx="${x(augIdx)}" cy="${y(augProj)}" r="3.6" fill="#b45309"/>
    <text x="${x(augIdx)-6}" y="${y(augProj)+4}" text-anchor="end" font-size="9.5"
      font-family="monospace" fill="#b45309">${(augProj/1000).toFixed(1)}k run rate</text>`;

  return `<div class="chart">
    <h3>Barks placed in ${DEMAND[key].cats.length} ${key==='wed'?'wedding':'moving and cleaning'} categories</h3>
    <div class="sub">${d.markets} &middot; monthly &middot; 2026 against 2025</div>
    <svg viewBox="0 0 ${w} ${h}" width="100%" role="img"
      aria-label="Monthly barks placed in the journey's categories, 2026 against 2025">
      ${grid}${yax}
      <polyline points="${p25}" fill="none" stroke="#c7c7c7" stroke-width="1.8"/>
      ${dots(d.y25,'#c7c7c7',11)}
      <polyline points="${p26}" fill="none" stroke="#171717" stroke-width="2"/>
      ${dots(d.y26,'#171717',lastFull)}
      ${partial}${labels}
    </svg>
    <div class="legend">
      <span><i style="background:#c7c7c7"></i>2025</span>
      <span><i style="background:#171717"></i>2026</span>
      <span><i style="background:#b45309"></i>Aug 2026 pro-rata (data to 16th)</span>
    </div></div>`;
}

function demandSummary(key){
  const d=DEMAND[key];
  const s25=d.y25.slice(0,7).reduce((a,b)=>a+b,0);
  const s26=d.y26.slice(0,7).reduce((a,b)=>a+b,0);
  const ytd=(s26-s25)/s25*100;
  const jul=(d.y26[6]-d.y25[6])/d.y25[6]*100;
  const augProj=Math.round(d.y26[7]/AUG_FRAC);
  const aug=(augProj-d.y25[7])/d.y25[7]*100;
  const sign=v=>(v>0?'+':'')+v.toFixed(1)+'%';
  return `<table class="bm"><thead><tr><th>Period</th><th>2025 barks</th>
      <th>2026 barks</th><th>Change</th></tr></thead><tbody>
    <tr><td>January to July</td><td>${num(s25)}</td><td>${num(s26)}</td>
      <td class="verdict ${ytd>0?'ahead':'behind'}">${sign(ytd)}</td></tr>
    <tr><td>July only</td><td>${num(d.y25[6])}</td><td>${num(d.y26[6])}</td>
      <td class="verdict ${jul>0?'ahead':'behind'}">${sign(jul)}</td></tr>
    <tr><td>August (2026 pro-rata)</td><td>${num(d.y25[7])}</td><td>${num(augProj)}</td>
      <td class="verdict ${aug>0?'ahead':'behind'}">${sign(aug)}</td></tr>
    </tbody></table>
    <div class="note"><b>Categories counted (${d.cats.length}):</b> ${d.cats.join(', ')}.
      Derived from Iterable list ${d.listId} <em>${d.listName}</em> plus the category links
      inside each template. ${d.excluded}</div>`;
}

      report, since the numbers are too small to report on either way.</div>` : `
    <div class="note"><b>No SMS or WhatsApp sends recorded for this journey</b> in the 12 weeks
      to 16 August. Either those steps do not exist in the journey or they never triggered.</div>`;

  return `<div class="sect"><h2>Push</h2>
      <span class="when">${p.camps.length} campaigns &middot; 27 May to 1 Sep 2026</span></div>

      but counted as any project within seven days of send regardless of whether the push was

/* ---------- test against control ---------- */
function controlSection(key){
  const a=ARMS[key], b=BENCH[key];
  const sum=(arr,f,t)=>arr.slice(f,t+1).reduce((x,y)=>x+y,0);
  const phase=(f,t)=>{
    const sn=sum(a.sends,f,t), hd=sum(a.skip1,f,t)+sum(a.skip0,f,t)+sum(a.ctrl2,f,t);
    return {sends:sn, held:hd, share:hd/(sn+hd)};
  };
  const L=phase(a.live[0],a.live[1]), P=phase(a.post[0],a.post[1]);

  /* holdout share by week */
  const w=980,h=180,pl=44,pr=20,pt=16,pb=28, iw=w-pl-pr, ih=h-pt-pb, n=a.weeks.length;
  const shares=a.weeks.map((_,i)=>{
    const hd=a.skip1[i]+a.skip0[i]+a.ctrl2[i], sn=a.sends[i];
    return (sn+hd)? hd/(sn+hd) : null;
  });
  const max=Math.max(...shares.filter(x=>x!=null))*1.15;
  const X=i=>pl+(iw/(n-1))*i, Y=v=>pt+ih-(v/max)*ih;
  const pts=shares.map((v,i)=>v==null?null:`${X(i)},${Y(v)}`).filter(Boolean).join(' ');
  const dots=shares.map((v,i)=>v==null?'':`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6"
      fill="${i>a.live[1]?'#dc2626':'#fff'}" stroke="${i>a.live[1]?'#dc2626':'#171717'}"
      stroke-width="1.6"/>`).join('');
  const brk=`<line x1="${X(a.live[1])}" x2="${X(a.live[1])}" y1="${pt}" y2="${pt+ih}"
      stroke="#dc2626" stroke-dasharray="3 3"/>
    <text x="${X(a.live[1])-6}" y="${pt+11}" text-anchor="end" font-size="9"
      font-family="monospace" fill="#dc2626">holdout stops firing</text>`;
  const lab=a.weeks.map((m,i)=>`<text x="${X(i)}" y="${h-9}" text-anchor="middle" font-size="8.5"
      font-family="monospace" fill="${i>a.live[1]?'#dc2626':'#a3a3a3'}">${m}</text>`).join('');
  const yax=[0,.5,1].map(f=>`<text x="${pl-8}" y="${pt+ih*(1-f)+3}" text-anchor="end"
      font-size="9" font-family="monospace" fill="#a3a3a3">${(max*f*100).toFixed(0)}%</text>`).join('');

  return `<p class="barlab"><span>Sendskip and control tiles inside journey ${FLOWS[key].journey}</span></p>
    <table class="bm"><thead><tr><th>Phase</th><th>Weeks</th><th>Test (sent)</th>
      <th>Held out</th><th>Holdout share</th><th>State</th></tr></thead><tbody>
      <tr><td>Test live</td><td>25 May to 13 Jul</td><td>${num(L.sends)}</td>
        <td>${num(L.held)}</td><td>${pct(L.share,1)}</td>
        <td class="verdict ahead">properly split</td></tr>
      <tr><td>After dissolution</td><td>17 Aug since launch</td><td>${num(P.sends)}</td>
        <td>${num(P.held)}</td><td>${pct(P.share,1)}</td>
        <td class="verdict behind">split collapsed</td></tr>
    </tbody></table>

    <div class="chart" style="margin-top:14px">
      <h3>Holdout share of audience by week</h3>
      <div class="sub">Red from the week the _1 arm stopped firing</div>
      <svg viewBox="0 0 ${w} ${h}" width="100%" role="img"
        aria-label="Holdout share of audience by week, showing the collapse after 13 July">
        ${yax}${brk}<polyline points="${pts}" fill="none" stroke="#171717" stroke-width="1.8"/>
        ${dots}${lab}
      </svg></div>

    <div class="keyfind"><div class="kf">What the arms show, and what they cannot</div>
      <p><b>The split was designed properly and then broke.</b> While the test ran, the
        holdout was ${pct(L.share,1)} of the audience, which is a sound experiment. From
        w/c 20 Jul it is ${pct(P.share,1)}, because the <em>_1</em> arm stopped firing
        after w/c 13 Jul${key==='mov'?' and the _0 arm stopped with it':' , leaving only the smaller _0 arm and the control tile'}.
        That date is the holdout dissolution, and it is visible in the chart above.</p>
      <p><b>Conversion still cannot be compared across the arms, in either phase.</b> This
        was tested, not assumed. Skip-only campaigns record zero projects everywhere in the
        datasource, not just here: 170.8m skip records on the largest single campaign and
        roughly 500m across the top 40, with no projects on any of them. The push datasource
        behaves the same way, with <em>buyer_count_eligible</em> at zero wherever sends are
        zero. Project attribution is computed against send events in both, so a held-out
        buyer can never be credited with a project. The arms can be compared on population,
        which is what this section does. They cannot be compared on conversion.</p>
      <p><b>This is why the lift figures came from elsewhere.</b> The Buyer Journey
        Experiment Report computes lift at buyer level rather than from send attribution,
        which is exactly why it can produce a number this datasource cannot. Its
        datasources are unpublished live JDBC connections, so this report cannot reach it.</p>
    </div>

    <table class="bm"><thead><tr><th>Arm</th><th>Iterable</th><th>Role</th>
      <th>Status</th></tr></thead><tbody>`+
      a.arms.map(([nm,id,role,st])=>`<tr${st.includes('stopped')?' class="flagrow"':''}>
        <td style="font-family:var(--mono);font-size:11px">${nm}${st.includes('stopped')?' &#9888;':''}</td>
        <td><a href="https://app.iterable.com/campaigns/${id}" target="_blank" rel="noopener"
          style="color:var(--brand);text-decoration:none">${id}</a></td>
        <td>${role}</td><td>${st}</td></tr>`).join('')+
    `</tbody></table>
    <div class="note">Per-category control tiles hold a further ${a.catControls} buyers in
      total and are not split by week here. <b>Last measured lift, carried forward:</b>
      ${a.priorLift}, from the Experiment 03 cohort analysis, covering the period when the
      holdout was intact. Not reproducible from any published Tableau datasource, so confirm
      against the Experiment Report before quoting. It is not this week's number, and it
      cannot be refreshed while the holdout is dissolved.</div>`;
}

/* ---------- render ---------- */
function render(key){
  const f=FLOWS[key], rows=f.weeks.map(W);
  /* Weeks run Wednesday to Tuesday, anchored to the Wednesday run day, so the last
     row is always a complete 7 days and needs no partial-week handling. */
  const cur=rows[rows.length-1], prev=rows[rows.length-2];
  const sum=rs=>rs.reduce((a,x)=>({s:a.s+x.s,o:a.o+x.o,c:a.c+x.c,u:a.u+x.u,
                                   b:a.b+x.b,p:a.p+x.p,r:a.r+x.r}),
                          {s:0,o:0,c:0,u:0,b:0,p:0,r:0});
  /* Headline bar is the last 3 months (13 Wed-Tue weeks), not since launch: blending
     many months hides how the journey is performing now. Since-launch detail lives in
     the 3-month increment chart further down. */
  const L3=rows.slice(-13), all=sum(L3), sinceLaunch=sum(rows);
  const l3from=L3[0].wc, l3to=rows[rows.length-1].wc;
  const c4=f.comms.reduce((a,c)=>({s:a.s+c.s,p:a.p+c.p}),{s:0,p:0});

  /* Bar 1 — last 3 months, no deltas. */
  const bar1=[
    statCard('Sends',num(all.s),L3.length+' weeks'),
    statCard('Open rate',pct(all.o/all.s,2),num(all.o)+' opens'),
    statCard('CTR',pct(all.c/all.s,3),num(all.c)+' clicks'),
    statCard('CTOR',pct(all.o?all.c/all.o:0,1),'clicks per open'),
    statCard('Unsub rate',pct(all.u/all.s,3),num(all.u)+' unsubs'),
    statCard('Bounce rate',pct(all.b/all.s,3),num(all.b)+' bounces'),
    statCard('Projects / 1k',per1k(all.p,all.s).toFixed(3),num(all.p)+' projects'),
    statCard('PPR / 1k sends',gbp1k(all.r,all.s),'attributed within 7d')
  ].join('');

  /* Bar 2 — last week against the week before. */
  const bar2=[
    wowCard('Sends',num(cur.s),delta(cur.s,prev.s,{dir:'neutral'})),
    wowCard('Open rate',pct(cur.o/cur.s,2),delta(cur.o/cur.s,prev.o/prev.s,{pp:true}),
            ztest(cur.o,cur.s,prev.o,prev.s)),
    wowCard('CTR',pct(cur.c/cur.s,3),delta(cur.c/cur.s,prev.c/prev.s,{pp:true,dp:3}),
            ztest(cur.c,cur.s,prev.c,prev.s)),
    wowCard('CTOR',pct(cur.o?cur.c/cur.o:0,1),delta(cur.c/cur.o,prev.c/prev.o,{pp:true,dp:1}),
            ztest(cur.c,cur.o,prev.c,prev.o)),
    wowCard('Unsub rate',pct(cur.u/cur.s,3),delta(cur.u/cur.s,prev.u/prev.s,{pp:true,dir:'down',dp:3}),
            ztest(cur.u,cur.s,prev.u,prev.s)),
    wowCard('Bounce rate',pct(cur.b/cur.s,3),delta(cur.b/cur.s,prev.b/prev.s,{pp:true,dir:'down',dp:3}),
            ztest(cur.b,cur.s,prev.b,prev.s)),
    wowCard('Projects',num(cur.p),delta(cur.p,prev.p)),
    wowCard('PPR / 1k sends',gbp1k(cur.r,cur.s),
            delta(per1k(cur.r,cur.s),per1k(prev.r,prev.s)))

  const list=(items,cls)=>`<div class="col ${cls}">
    <h3>${cls==='w'?'What is working':'What needs attention'}</h3>
    <ul>${items.map(([h,b])=>`<li><b>${h}</b> ${b}</li>`).join('')}</ul></div>`;

    <p class="barlab"><span>${L3.length} Wed&ndash;Tue weeks &middot; rates recalculated from summed events</span>
      <span>Since launch: ${num(sinceLaunch.s)} sends</span></p>
    <div class="kpis">${bar1}</div>

    <div class="sect bar2"><h2>Week on week</h2>
      <span class="when">26 Aug&ndash;1 Sep vs 19&ndash;25 Aug</span></div>
    <p class="barlab"><span>Latest complete week and its move on the week before</span></p>
    <div class="kpis">${bar2}</div>

    <div class="keyfind"><div class="kf">Read this first</div>
      ${f.context.map(p=>`<p>${p}</p>`).join('')}</div>

    <div class="sect"><h2>Wins, issues and learnings</h2>
      <span class="when">Significance-tested</span></div>
    <div class="note"><b>Every claim below has been tested.</b> Two-proportion z-tests at

    <div class="cols">${list(f.wins,'w')}${list(f.attention,'a')}</div>

    ${cycleAndActions(key)}

    ${key==='wed' ? sec('Legacy wedding campaigns, this window last year',

      <ul>
        <li><b>Weeks run Wednesday to Tuesday</b>, anchored to the Wednesday run day, so
            the latest week is always a complete seven days with no partial-week stub. The
            trade-off is that the final day or two of each week is still accruing opens and
            clicks when the report is built, so the most recent week reads slightly low and
            firms up over the following days. Compare like with like across weeks rather than
            reading a single week's absolute level too precisely.</li>

            can drag the whole percentage down. Performance across the full life of the
            flow is in the 3-month increment chart, where each period stands on its own.</li>
        <li><b>PPR is always shown per 1,000 sends</b>, never as total revenue, so it can

        <li><b>Benchmarks are category-level</b> and rebuilt from the same datasource each week

            <em>weddings</em>; Moving Home against <em>cleaning, house_cleaning, odd_jobs</em>

        <li><b>Conversion</b> is projects submitted and PPR revenue attributed to a send within
            seven days. It answers what an email touched, not what the flow caused. Holdout
            lift per 1K buyers still comes from the Buyer Journey Experiment Report, which runs
            on an unpublished live JDBC datasource and has to be added by hand.</li>
        <li><b>Comm-level figures</b> are rolled up over four weeks on purpose. A single week
            per comm lands at 300 to 1,200 sends, where a handful of clicks swings the rate
            more than any creative change would.</li>
        <li><b>Bark volume</b> comes from the Tableau <em>Projects &middot;
            Country-Category-Date-Channel-Source</em> datasource, counting projects submitted
            in the categories each journey targets. August 2026 covers 1 to 16 August only,
            so the chart marks both the actual partial figure and a pro-rata run rate.</li>
        <li><b>Send skips</b> are excluded from all send counts, so the control and holdout
            campaigns inside both journeys sit outside these figures.</li>
      </ul>
    </footer>`;
}

['wed','mov'].forEach(render);

/* ---------- chart hover tooltips ---------- */
(function(){
  const tip=document.getElementById('tip');
  document.addEventListener('mouseover',e=>{
    const t=e.target.closest('[data-tip]');
    if(!t) return;
    tip.innerHTML=t.getAttribute('data-tip').split('|').join('<br>');
    tip.style.opacity='1';
  });
  document.addEventListener('mousemove',e=>{
    if(tip.style.opacity!=='1') return;
    const pad=14, r=tip.getBoundingClientRect();
    let x=e.clientX+pad, y=e.clientY+pad;
    if(x+r.width>innerWidth-8) x=e.clientX-r.width-pad;
    if(y+r.height>innerHeight-8) y=e.clientY-r.height-pad;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  });
  document.addEventListener('mouseout',e=>{
    if(e.target.closest('[data-tip]')) tip.style.opacity='0';
  });
})();

/* ---------- metric toggle on the increment charts ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('.mtoggle button');
  if(!b) return;
  const box=b.closest('.chart');
  box.querySelectorAll('.mtoggle button').forEach(o=>
    o.setAttribute('aria-pressed', o===b ? 'true' : 'false'));
  box.querySelectorAll('svg[data-series]').forEach(sv=>
    sv.style.display = sv.getAttribute('data-series')===b.dataset.m ? 'block' : 'none');
});

const tabs=[...document.querySelectorAll('.tab')];
tabs.forEach((t,i)=>{
  t.addEventListener('click',()=>{
    tabs.forEach(o=>{
      const on=o===t;
      o.setAttribute('aria-selected',on);
      document.getElementById(o.getAttribute('aria-controls')).hidden=!on;
    });
  });
  t.addEventListener('keydown',e=>{
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
    const j=(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
    tabs[j].click(); tabs[j].focus();
  });
});

</script>
